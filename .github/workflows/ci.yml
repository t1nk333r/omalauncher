name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history, so scripts/affected-tests.py finds where the push or pull request starts.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The NDK app/build.gradle.kts pins; installed up front so AGP doesn't download it mid-build.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null

      # Only the unit tests the change can affect; a base it can't find (a new branch) runs them all.
      - name: Test
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./gradlew $(scripts/affected-tests.py --base "$BASE" --head HEAD) :owl:owlJar

      # Builds without proot (scripts/fetch-proot.sh), which is enough to compile wlbridge and run lint.
      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug
